[package]
name = "lavoir"
version = "0.1.0"
description = "Un lavoir pour les médias : tout ressort propre, rien ne reste."
authors = ["linel"]
edition = "2021"

[lib]
name = "lavoir_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
